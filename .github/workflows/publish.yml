name: Publish to Registry
on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup UniStack
        uses: snowdreamtech/setup-unistack@e1acc8a705f9de654ee3619918b561f861141371 # v1

      - name: Build Packages and Generate Index
        run: |
          # 1. Initialize the output registry directory
          unistack repo init dist
          
          # 2. Iterate through all valid community packages and add them to the registry
          # The directory structure is packages/a/author/package/
          for pkg_dir in $(find packages -mindepth 3 -maxdepth 3 -type d); do
            if [ -f "$pkg_dir/package.yml" ]; then
              echo "Packaging $pkg_dir..."
              
              # Extract package name and version to create the tarball name
              # e.g. packages/s/snowdreamtech/nginx -> snowdreamtech_nginx-1.0.0.tar.gz
              # For simplicity, we can let unistack handle the tar.gz creation if the CLI supports it,
              # OR we can manually tar it and add it.
              # Here we manually tar it to match the `.tar.gz` format required by the spec.
              
              PKG_NAME=$(grep -oP '(?<=name: ")[^"]*' "$pkg_dir/package.yml" || grep -oP '(?<=name: )[^ ]*' "$pkg_dir/package.yml" || true)
              PKG_VER=$(grep -oP '(?<=version: ")[^"]*' "$pkg_dir/package.yml" || grep -oP '(?<=version: )[^ ]*' "$pkg_dir/package.yml" || true)
              
              # Replace / with _ for the filename
              SAFE_NAME="${PKG_NAME//\//_}"
              TAR_NAME="${SAFE_NAME}-${PKG_VER}.tar.gz"
              
              tar -czf "$TAR_NAME" -C "$pkg_dir" .
              
              # Add to the registry (this copies it into dist/packages/... and validates it)
              unistack repo add dist "$TAR_NAME"
            fi
          done
          
          # 3. Build the SQLite index (packages.db) for the registry
          unistack repo build dist

      - name: Deploy to Remote Server via native rsync
        env:
          # SSH private key for authenticating with the remote registry server
          SSH_PRIVATE_KEY: ${{ secrets.UNISTACK_REGISTRY_SSH_PRIVATE_KEY }}
          # IP address or domain name of the remote registry server
          REMOTE_HOST: ${{ secrets.UNISTACK_REGISTRY_HOST }}
          # SSH login username for the remote registry server
          REMOTE_USER: ${{ secrets.UNISTACK_REGISTRY_USER }}
          # Target deployment path on the remote CDN or static storage server
          REMOTE_TARGET_PATH: ${{ secrets.UNISTACK_REGISTRY_TARGET_PATH }}
        run: |
          # 1. Start ssh-agent and load the private key
          mkdir -p ~/.ssh
          eval $(ssh-agent -s)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          
          # 2. Bypass SSH host key verification on first connection (StrictHostKeyChecking)
          cat >> ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
          EOF
          
          # 3. Use native rsync for incremental push (flag -c enables checksum comparison)
          rsync -rlgoDzvc -e "ssh -o StrictHostKeyChecking=no" dist/ ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_TARGET_PATH}
