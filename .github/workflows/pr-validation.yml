name: PR Validation
on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      dind:
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate Package Namespace
        run: |
          # Check all package.yml files that were modified or added in this PR
          for file in $(git diff --name-only origin/main | grep '^packages/.*package\.yml$' || true); do
            if [ -f "$file" ]; then
              # Extract the 'name' field
              NAME=$(grep -oP '(?<=name: ")[^"]*' "$file" || grep -oP '(?<=name: )[^ ]*' "$file")
              if [[ ! "$NAME" == *"/"* ]]; then
                echo "Error: Package '$NAME' in $file MUST contain a namespace prefix (e.g., author/package)."
                echo "Core namespaces without a prefix are strictly prohibited in the community registry."
                exit 1
              fi
              echo "✅ Package $NAME passed namespace validation."
            fi
          done

      - name: Validate YAML Format
        run: |
          # Basic YAML linting
          sudo apt-get install -y yamllint
          for file in $(git diff --name-only origin/main | grep '^packages/.*package\.yml$' || true); do
            if [ -f "$file" ]; then
              yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "$file"
              echo "✅ $file passed yaml linting."
            fi
          done

      - name: Real Installation Sandbox Test
        timeout-minutes: 10
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: |
          # Run actual package installation in an ephemeral container.
          # The container acts as the sandbox. It is allowed network access to verify upstream packages (e.g. apt, docker pull),
          # but relies on GitHub Actions' fork isolation (no secrets) and a strict timeout to prevent abuse (e.g. mining).
          for file in $(git diff --name-only origin/main | grep '^packages/.*package\.yml$' || true); do
            if [ -f "$file" ]; then
              echo "Testing real installation of $file in sandbox..."
              pkg_dir=$(dirname "$file")
              
              # Run an Ubuntu container with network to test real installation.
              # The container will be destroyed after the test (--rm).
              # TODO: Replace the sh -c command with the actual unistack install command once CLI is ready.
              docker run --rm \
                -v ${{ github.workspace }}/$pkg_dir:/pkg:ro \
                ubuntu:22.04 \
                sh -c "echo 'TODO: unistack install /pkg/package.yml' && echo 'Simulating real installation (apt/docker pull)...'"
              
              echo "✅ $file passed real installation validation."
            fi
          done
